name: Release

# Manual only since the BD2 hand-off (II-4-9 review, suggestion s-2).
# This workflow used to chain on every successful CI run on main and cut a
# conventional-commit release automatically. That broke the Manual's promise
# that the final tag (v1.1.0) is the very commit the Final Report was built
# from: any later "fix:" commit would have produced v1.1.1 and detached the
# two again. Run it from Actions -> Release -> Run workflow when a release is
# actually wanted; until then CI stays automatic and releases do not.
#
# Version bump still follows Conventional Commits since the last tag:
#   feat: ...          -> minor bump
#   fix: ...            -> patch bump
#   BREAKING CHANGE     -> major bump (in body or with a "!" after the type)
#   anything else       -> no release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "release" to cut a release from the current main
        required: true
        default: ''

permissions:
  contents: write

jobs:
  release:
    if: github.event.inputs.confirm == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next version
        id: ver
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last_tag" ]; then
            last_tag="v0.0.0"
            range=""
          else
            range="$last_tag.."
          fi
          echo "last_tag=$last_tag"

          log=$(git log $range --pretty=format:'%s%n%b' 2>/dev/null || true)
          bump=none
          if echo "$log" | grep -qiE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
            bump=major
          elif echo "$log" | grep -qE '^feat(\(.+\))?:'; then
            bump=minor
          elif echo "$log" | grep -qE '^fix(\(.+\))?:'; then
            bump=patch
          fi

          if [ "$bump" = none ]; then
            echo "No feat/fix/breaking commits since $last_tag - nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ver=${last_tag#v}
          IFS=. read -r major minor patch <<< "$ver"
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          next="v$major.$minor.$patch"
          echo "Bumping $last_tag -> $next ($bump)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"

      - name: Tag and create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          last_tag="${{ steps.ver.outputs.last_tag }}"
          range="${last_tag}.."
          [ "$last_tag" = "v0.0.0" ] && range=""

          git tag "$tag"
          git push origin "$tag"

          notes=$(git log $range --pretty=format:'- %s (%h)')
          gh release create "$tag" \
            --title "$tag" \
            --notes "## Changes since $last_tag
          $notes"
