name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make check
      - name: --json mode matches text mode (tests/json_check.py)
        run: python3 tests/json_check.py

  web:
    name: Next.js web app
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Build the C core (web/'s /api/run spawns ../kds)
        run: make
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: npm run build
        working-directory: web
        run: npm run build
      - name: node --test (lib/ unit + integration tests against ./kds)
        working-directory: web
        run: npm test
